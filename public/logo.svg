<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7650F8" />
      <stop offset="100%" stop-color="#5E38ED" />
    </linearGradient>
    <filter id="softGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#6A45F5" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Globo de diálogo con punta inferior izquierda (Violeta Mentor #6A45F5) -->
  <path d="M 160 48
           L 352 48
           C 424 48, 468 92, 468 164
           L 468 304
           C 468 376, 424 420, 352 420
           L 182 420
           L 84 472
           C 72 478, 64 470, 68 456
           L 80 404
           C 54 380, 44 346, 44 304
           L 44 164
           C 44 92, 88 48, 160 48
           Z"
        fill="url(#bubbleGrad)"
        filter="url(#softGlow)" />

  <!-- Figura del estudiante / aprendiz (X + Punto Menta) -->
  <g id="menteePerson">
    <!-- Cabeza: Menta Logro #2BD49A -->
    <circle cx="256" cy="126" r="28" fill="#2BD49A" />

    <!-- Brazos y piernas en X: Blanco Bruma #FFFFFF -->
    <line x1="178" y1="196" x2="334" y2="352"
          stroke="#FFFFFF" stroke-width="48" stroke-linecap="round" />
    <line x1="334" y1="196" x2="178" y2="352"
          stroke="#FFFFFF" stroke-width="48" stroke-linecap="round" />
  </g>
</svg>