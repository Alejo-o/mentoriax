<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="owlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2233" />
      <stop offset="100%" stop-color="#0E131F" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2F89C" />
      <stop offset="100%" stop-color="#9CE37D" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#owlBg)" stroke="#81559B" stroke-width="2.5" />
  
  <!-- Owl Body -->
  <path d="M 36 60 C 36 38, 92 38, 92 60 C 92 92, 78 106, 64 106 C 50 106, 36 92, 36 60 Z" fill="#151E2E" stroke="#93C6D6" stroke-width="2" />
  
  <!-- Feather chest pattern -->
  <path d="M 54 78 Q 64 84 74 78" fill="none" stroke="#81559B" stroke-width="2" stroke-linecap="round" />
  <path d="M 56 86 Q 64 92 72 86" fill="none" stroke="#81559B" stroke-width="2" stroke-linecap="round" />
  
  <!-- Owl Eyes / Glasses (Wise Mentor) -->
  <circle cx="51" cy="58" r="14" fill="#0E131F" stroke="url(#goldGrad)" stroke-width="2.5" />
  <circle cx="77" cy="58" r="14" fill="#0E131F" stroke="url(#goldGrad)" stroke-width="2.5" />
  <line x1="65" y1="58" x2="63" y2="58" stroke="url(#goldGrad)" stroke-width="3" />
  
  <circle cx="51" cy="58" r="6" fill="#9CE37D" />
  <circle cx="77" cy="58" r="6" fill="#9CE37D" />
  <circle cx="53" cy="56" r="2" fill="#FFFFFF" />
  <circle cx="79" cy="56" r="2" fill="#FFFFFF" />
  
  <!-- Beak -->
  <polygon points="64,66 60,74 68,74" fill="#FF9F6E" />
  
  <!-- Graduation Cap on Owl -->
  <g transform="translate(64, 28)">
    <polygon points="0,-10 24,-2 0,6 -24,-2" fill="#81559B" stroke="#93C6D6" stroke-width="1.5" />
    <path d="M -12,2 L -12,8 C -12,12 12,12 12,8 L 12,2 Z" fill="#151b28" />
    <path d="M 18,0 L 22,10 L 24,12" stroke="#E2F89C" stroke-width="1.8" fill="none" />
    <circle cx="24" cy="13" r="1.8" fill="#E2F89C" />
  </g>
</svg>
